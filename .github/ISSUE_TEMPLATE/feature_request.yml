name: Feature or research extension
description: Suggest a new environment, method, or benchmark
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes: {label: Summary, description: What would you like to add?}
    validations: {required: true}
  - type: textarea
    id: motivation
    attributes: {label: Motivation, description: What problem does it solve, or what question does it answer?}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New robot environment
        - Dynamics learning method
        - Safety / reachability method
        - RL algorithm
        - Visualization / replay
        - Population / game theory
        - Documentation / tutorials
        - Other
    validations: {required: true}
  - type: textarea
    id: approach
    attributes: {label: Proposed approach (optional)}
  - type: textarea
    id: research
    attributes: {label: Relevant papers or implementations (optional)}
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to open a PR for this myself.
