# EXPLORATORY. Conformal certifiers (C0, distance-normalised C1b, leave-region-out C2) adapted to the
# framework (lcert.framework.bound_certifiers).  Same learned model/data recipe as di_ensemble.yaml
# (i.i.d. samples outside the gap) -> NOT the preregistered pipeline; numbers are not P1/S2 numbers.
name: di_conformal
env: di_hidden_physics
env_params: {grid_size: 101, accuracy: medium}
certifier: conformal
certifier_params:
  members: 3
  hidden_sizes: [32, 32]
  epochs: 60
  n_samples: 2000
  seed: 0
  dims: [1]            # disturbance on v' only (p' = v is known exactly)
  n_calib: 500
  calib_region: {lo: [1.8, -2.0], hi: [2.4, 2.0]}   # used by C2 only; disjoint from gap p in [0.4, 1.0]
policies:
  - {name: di_go_to, params: {target: 0.05, kp: 3.0, kd: 1.0}}
initial_states: [[1.6, -0.6]]
sweep:
  certifier.variant: [C0, C1b, C2]
  certifier.alpha: [0.5, 0.2, 0.1, 0.05, 0.01]
dt: 0.02
steps: 150
