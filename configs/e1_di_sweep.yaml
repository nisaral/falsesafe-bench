  hi: [1.25, 0.75]
model:
  type: ensemble_mlp
  members: 3
  hidden_sizes: [32, 32]
  epochs: 60
  learning_rate: 0.002
inflation_k_values: [0.0, 0.5, 1.0, 2.0]
